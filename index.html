<head>
    <meta charset="UTF-8">

    <title>Section 23 // Pirate Radio Terminal</title>
    <style>
               /* Phosphor Terminal Grid Layout Matrix */
        body {
            background-color: #000000;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #33ff33;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 🔒 FIXED: Changed from hidden to auto so you can scroll down to your tools */
            overflow-y: auto; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        .crt-chassis {
            border: 2px solid #33ff33;
            background: rgba(0, 15, 0, 0.9);
            box-shadow: 0 0 20px #005500, inset 0 0 15px #003300;
            padding: 30px;
            border-radius: 8px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        /* Console Control Deck Button Container */
        .control-deck {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 15px 0;
        }

        /* 1990s Arcade Tactile Push Button Style */
        .power-switch {
            background: #000000;
            border: 2px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #005500;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            flex: 1;
            min-width: 105px;
            text-shadow: none;
        }

        .power-switch:hover {
            background: #33ff33;
            color: #000000;
            box-shadow: 0 0 20px #33ff33;
        }

        /* Responsive Dashboard text readout window */
        #trackInfo {
            font-size: 13px;
            margin: 25px 0;
            height: 60px;
            overflow: hidden;
            border: 1px solid #005500;
            padding: 10px;
            background: #000500;
            border-radius: 4px;
            text-align: left;
            line-height: 1.4;
            word-break: break-all;
        }

        /* HTML5 Native Component Coloring Overrides */
        audio {
            width: 100%;
            margin-top: 15px;
            filter: invert(1) hue-rotate(90deg) saturate(1.5); 
        }

        .terminal-specs {
    font-size: 11px;
    color: #008800;
    margin-top: 12px;
    line-height: 1.6 !important;  /* Stops text letters from clipping vertically */
    padding-bottom: 5px;          /* Safely extends the interior border space */
}

		/* =================================================================== */
/* SECTION 23: TACTICAL SIDEBAR PRESET CONSOLE                         */
/* =================================================================== */

/* Retro Mechanical Sidebar Console Container */
.s23-sidebar-preset-panel {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 15px;
    width: 70px;
    background: #080808;
    border: 2px solid #00ff00;
    border-radius: 5px;
    padding: 15px 6px;
    box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
    margin-right: 15px; /* Creates a clean gap before the main terminal elements */
}

/* Tactile Push-Button Matrices */
.s23-preset-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 55px;
    background: #111;
    color: #00ff00;
    border: 2px solid #005500;
    border-radius: 4px;
    font-family: monospace;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 0 0 4px rgba(0, 255, 0, 0.6);
    box-shadow: 0 4px 0 #003300, inset 0 2px 3px rgba(255, 255, 255, 0.1);
    transition: all 0.05s ease;
}

.s23-preset-btn span {
    font-size: 9px;
    color: #008800;
    margin-top: 2px;
}

/* Active Mechanical Compression Styles */
.s23-preset-btn:hover {
    background: #151515;
    border-color: #00ff00;
}

.s23-preset-btn:active, .s23-preset-btn.tuning-active {
    background: #001100;
    border-color: #00ff00;
    box-shadow: 0 1px 0 #003300, inset 0 4px 8px rgba(0, 0, 0, 0.8);
    transform: translateY(3px);
    color: #fff;
    text-shadow: 0 0 8px #00ff00;
}
#bbc-floating-deck {
    position: fixed;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    z-index: 9999;
    background: #000000;
    border: 2px solid #00ff00;
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.5), inset 0 0 5px rgba(0, 255, 0, 0.3);
    padding: 10px 15px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    cursor: move;
    user-select: none;
    border-radius: 4px;
}

#bbc-floating-deck:active {
    border-color: #ffffff;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
}

#bbc-broadcast-link {
    color: #00ff00;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 2px;
    pointer-events: auto;
}

#bbc-floating-deck:active #bbc-broadcast-link {
    color: #ffffff;
}
		

    </style>
</head>
