<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section 23 // Pirate Radio Terminal</title>
    <style>
        /* Phosphor Terminal Grid Layout Matrix */
        body {
            background-color: #000000;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #33ff33;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .crt-chassis {
            border: 2px solid #33ff33;
            background: rgba(0, 15, 0, 0.9);
            box-shadow: 0 0 20px #005500, inset 0 0 15px #003300;
            padding: 30px;
            border-radius: 8px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        /* Console Control Deck Button Container */
        .control-deck {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 15px 0;
        }

        /* 1990s Arcade Tactile Push Button Style */
        .power-switch {
            background: #000000;
            border: 2px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 0 10px #005500;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            flex: 1;
        }

        .power-switch:hover {
            background: #33ff33;
            color: #000000;
            box-shadow: 0 0 20px #33ff33;
        }

        /* Responsive Dashboard text readout window */
        #trackInfo {
            font-size: 13px;
            margin: 25px 0;
            height: 60px;
            overflow: hidden;
            border: 1px solid #005500;
            padding: 10px;
            background: #000500;
            border-radius: 4px;
            text-align: left;
            line-height: 1.4;
        }

        /* HTML5 Native Component Coloring Overrides */
        audio {
            width: 100%;
            margin-top: 15px;
            filter: invert(1) hue-rotate(90deg) saturate(1.5); /* Forces standard players into green camo themes */
        }

        .terminal-specs {
            font-size: 10px;
            color: #008800;
            margin-top: 25px;
            text-shadow: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="crt-chassis">
    <h2>📡 SECTION 23 NODE</h2>
    <p style="font-size: 11px; color: #00aa00;">AUTONOMOUS AUDIO SUBVERSION STREAM</p>
    <br>
    
   <div class="control-deck">
    <button id="playButton" class="power-switch">Connect</button>
    <button id="skipButton" class="power-switch">Skip Track</button>
    <button id="exportLogButton" class="power-switch">Export Log</button>
</div>


    
    <div id="trackInfo">Awaiting connection tracking initialization...</div>

    <audio id="audioPlayer" controls></audio>

    <div class="terminal-specs">
        NODE ADDR: 0x63673528404C9B9394d4Ec6FA037ED825c8b0faa<br>
        SYS STATUS: 382 LINKS HARVESTED // WEB 1.0 LEECHING LIVE<br>
        Copyright © 2023 Psico Communications
    </div>
</div>

<script>
      // --- CORE AUDIO JUKEBOX LOGIC ENGINE ---
    const audioPlayer = document.getElementById('audioPlayer');
    const trackInfo = document.getElementById('trackInfo');

    let mp3Files = []; // Array to store MP3 URLs from load.json

    // Function to pull a pure random link out of the database array instantly
    async function playPureRandomTrack() {
        if (mp3Files.length === 0) {
            try {
                trackInfo.textContent = '📡 Syncing with local manifest database node...';
                const response = await fetch('load.json');
                const data = await response.json();
                mp3Files = data.mp3s.slice();
                console.log(`📦 Broadcast matrix live: ${mp3Files.length} remote links available.`);
            } catch (error) {
                console.error('❌ Error loading transmission node manifest:', error);
                trackInfo.textContent = 'Connection Error: Unable to read load.json data archive.';
                return;
            }
        }

        const randomIndex = Math.floor(Math.random() * mp3Files.length);
        const targetTrackUrl = mp3Files[randomIndex];

        // 🔒 FIX: Decode the text strings so raw spaces and characters go straight to the decoder
        const decodedUrl = decodeURIComponent(targetTrackUrl);
        const rawFileName = decodedUrl.substring(decodedUrl.lastIndexOf('/') + 1);

        // 🔒 FIXED: Set the source directly to the uncompromised decoded URL string
        audioPlayer.src = decodedUrl;
        trackInfo.textContent = 'Now playing: ' + rawFileName;

        // 🔒 FIXED: Direct execution call without internal handler redirection barriers
        try {
            await audioPlayer.play();
            console.log('📡 Audio decoder locked on stream: ' + rawFileName);
        } catch (playError) {
            console.warn('⚠️ Playback blocked by browser policy. Awaiting manual user interaction.', playError);
            trackInfo.textContent = '⚠️ Click "Connect" or hit the play bar below to force the stream.';
        }
    }

    // Bind master event handlers to handle instant random selection loops
    document.getElementById('playButton').addEventListener('click', playPureRandomTrack);
    document.getElementById('skipButton').addEventListener('click', playPureRandomTrack); 
    audioPlayer.addEventListener('ended', playPureRandomTrack);


</script>
  <script>
    // --- SECTION 23 TELEMETRY REGISTER & WALLPAPER MATRIX ---
    window.sessionLogRegistry = window.sessionLogRegistry || [];

    // Helper to get track name
    function getCleanTrackName(srcUrl) {
        if (!srcUrl) return "Unknown Track";
        return decodeURIComponent(srcUrl.substring(srcUrl.lastIndexOf('/') + 1));
    }

    // 🟢 Track Init/Play Logger & Wallpaper Loader
    audioPlayer.addEventListener('playing', function() {
        const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
        const currentUrl = audioPlayer.src;
        
        // 🖼️ WALLPAPER ENGINE: Extract the repository root path up to the last forward slash
        const repoRootPath = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
        const thumbnailName = "x-radio-wallpaper-07_thumb.jpg";
        const targetWallpaperUrl = repoRootPath + thumbnailName;

        // Apply image live onto the CSS background with a centered, screen-fit style ruleset
        document.body.style.backgroundImage = `url('${targetWallpaperUrl}')`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        document.body.style.backgroundRepeat = "no-repeat";

        // Log track to session registry
        const logEntry = `[${timestamp}] ✅ PLAYING: ${getCleanTrackName(currentUrl)}\n📍 URL: ${currentUrl}\n🖼️ BG IMAGE: ${targetWallpaperUrl}\n`;
        window.sessionLogRegistry.push(logEntry);
        console.log("💾 Terminal logged: Active track entry & wallpaper mapped.");
    });

    // 🔴 Broken Link / Dead Signal Logger
    audioPlayer.addEventListener('error', function() {
        const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
        const failedUrl = audioPlayer.src;
        const errorDetails = audioPlayer.error;
        
        let errorType = "UNKNOWN_ERR";
        if (errorDetails) {
            switch(errorDetails.code) {
                case 1: errorType = "MEDIA_ERR_ABORTED"; break;
                case 2: errorType = "MEDIA_ERR_NETWORK"; break;
                case 3: errorType = "MEDIA_ERR_DECODE"; break;
                case 4: errorType = "MEDIA_ERR_SRC_NOT_SUPPORTED"; break;
            }
        }

        const logEntry = `[${timestamp}] ❌ TRANSMISSION_FAILURE // TYPE: ${errorType}\n📍 URL: ${failedUrl}\n📝 FILE: ${getCleanTrackName(failedUrl)}\n--------------------------------------------------\n`;
        window.sessionLogRegistry.push(logEntry);
        
        trackInfo.innerHTML = `<span style="color: #ff3333;">❌ BROKEN LINK DETECTED:</span><br>` + 
                              `<span style="font-size: 11px; color: #ffaa00;">${getCleanTrackName(failedUrl)}</span>`;

        setTimeout(() => {
            if (typeof playPureRandomTrack === "function") {
                playPureRandomTrack();
            }
        }, 3000);
    });

    // 💾 Direct Download Trigger
    document.getElementById('exportLogButton').addEventListener('click', function() {
        if (!window.sessionLogRegistry || window.sessionLogRegistry.length === 0) {
            alert("⚠️ Terminal Info: No transmission matrix telemetry logged yet.");
            return;
        }

        const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
        const header = `==================================================\n` +
                       `📡 SECTION 23 // PIRATE RADIO TERMINAL LOG EXPORT\n` +
                       `📅 EXPORT TIME: ${timestamp}\n` +
                       `==================================================\n\n`;

        const finalFileContent = header + window.sessionLogRegistry.join('\n');
        
        const blob = new Blob([finalFileContent], { type: 'text/plain;charset=utf-8' });
        const dataUrl = URL.createObjectURL(blob);
        
        const downloader = document.createElement('a');
        downloader.href = dataUrl;
        downloader.download = 'section23_radio_log.txt';
        downloader.click();
        
        setTimeout(() => URL.revokeObjectURL(dataUrl), 100);
    });
</script>
  <script>
    // --- SECTION 23 TELEMETRY WALLPAPER MATRIX ---
    (function() {
        const player = document.getElementById('audioPlayer');
        if (!player) return;

        player.addEventListener('playing', function() {
            const currentUrl = player.src;
            
            if (currentUrl.includes('/download/')) {
                // Find where the folder paths begin
                const marker = '/download/';
                const markerIndex = currentUrl.indexOf(marker);
                
                // Isolate the remaining path text string after /download/
                const pathAfterDownload = currentUrl.substring(markerIndex + marker.length);
                
                // Extract just the COLLECTIONNAME (the first element before any sub-folder slashes)
                const collectionName = pathAfterDownload.split('/')[0];
                
                // 🔒 FIXED CONSTRUCTION: Forced to your exact string pattern with the double slash
                const targetWallpaperUrl = "https://archive.org/download/" + collectionName + "/__ia_thumb.jpg";

                // Inject the generated image path straight to your web page background layer
                document.body.style.backgroundImage = "url('" + targetWallpaperUrl + "')";
                document.body.style.backgroundSize = "cover";
                document.body.style.backgroundPosition = "center";
                document.body.style.backgroundRepeat = "no-repeat";
                
                console.log("📡 Core Matrix Locked: " + targetWallpaperUrl);
            }
        });
    })();
</script>
    <script>

// --- SECTION 23 BULLETPROOF BG LOGIC ENGINE ---
document.getElementById('triggerBtn').addEventListener('click', function() {
    const trackUrl = document.getElementById('testUrlInput').value.trim();
    const display = document.getElementById('urlDisplay');

    if (!trackUrl) {
        alert("Please paste a URL first.");
        return;
    }

    // Step 1: Handle bare default input url safely
    if (trackUrl === "https://archive.org" || trackUrl === "https://archive.org") {
        display.innerHTML = `<span style="color: #ff9900;">⚠️ NOTICE: Please paste a real item link first! Using fallback to load your target string directly...</span>`;
        executeBackgroundUpdate("alanwattscollection", display);
        return;
    }

    // Step 2: Extract the unique collection matrix name cleanly across all redirect configurations
    let collectionName = "";
    
    if (trackUrl.includes("/items/")) {
        collectionName = trackUrl.split("/items/")[1].split("/")[0];
    } else if (trackUrl.includes("/download/")) {
        collectionName = trackUrl.split("/download/")[1].split("/")[0];
    } else if (trackUrl.includes("/details/")) {
        collectionName = trackUrl.split("/details/")[1].split("/")[0];
    } else if (trackUrl.includes("/metadata/")) {
        collectionName = trackUrl.split("/metadata/")[1].split("/")[0];
    }

    // Step 3: Run structural alignment execution or throw parsing exception
    if (collectionName) {
        executeBackgroundUpdate(collectionName, display);
    } else {
        display.innerHTML = `<span style="color: #ff3333;">❌ ERROR: Invalid Link Pattern. Matrix mapping failed to find target item directory.<br><br>Received Input: ${trackUrl}</span>`;
    }
});

// Structural compiler wrapper to keep things clean and modular
function executeBackgroundUpdate(collection, displayElement) {
    const targetWallpaperUrl = "https://archive.org" + collection + "/__ia_thumb.jpg";

    // Output direct node path straight to your visual readout dashboard
    displayElement.innerHTML = `<strong>GENERATED DIRECT STRING:</strong><br>${targetWallpaperUrl}`;

    // Force feed the static asset directly to the browser window background layer
    document.body.style.backgroundImage = "url('" + targetWallpaperUrl + "')";
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundRepeat = "no-repeat";
    
    console.log("📡 Direct Storage Node Locked: " + targetWallpaperUrl);
}


</script>
