               /* Phosphor Terminal Grid Layout Matrix */
        body {
            background-color: #000000;

            border-radius: 8px;

        /* Console Control Deck Button Container */
        .control-deck {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 15px 0;
        }

        /* 1990s Arcade Tactile Push Button Style */
        .power-switch {
            background: #000000;
            border: 2px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #005500;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            flex: 1;
            min-width: 105px;
            text-shadow: none;
        }

        .power-switch:hover {
            background: #33ff33;
            color: #000000;
            box-shadow: 0 0 20px #33ff33;
        }

        /* Responsive Dashboard text readout window */
        #trackInfo {
            font-size: 13px;
            margin: 25px 0;
            height: 60px;
            overflow: hidden;
            border: 1px solid #005500;
            padding: 10px;
            background: #000500;
            border-radius: 4px;
            text-align: left;
            line-height: 1.4;
            word-break: break-all;
        }

        /* HTML5 Native Component Coloring Overrides */
        audio {
            width: 100%;
            margin-top: 15px;
            filter: invert(1) hue-rotate(90deg) saturate(1.5); 
        }

        .terminal-specs {
    font-size: 11px;
    color: #008800;

    padding-bottom: 5px;          /* Safely extends the interior border space */
}

/* Retro Mechanical Sidebar Console Container */

    box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
    margin-right: 15px; /* Creates a clean gap before the main terminal elements */
}

/* Tactile Push-Button Matrices */
.s23-preset-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 55px;
    background: #111;

    border: 2px solid #005500;
    border-radius: 4px;
    font-family: monospace;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 0 0 4px rgba(0, 255, 0, 0.6);
    box-shadow: 0 4px 0 #003300, inset 0 2px 3px rgba(255, 255, 255, 0.1);
    transition: all 0.05s ease;
}

.s23-preset-btn span {
    font-size: 9px;
    color: #008800;
    margin-top: 2px;
}

/* Active Mechanical Compression Styles */
.s23-preset-btn:hover {
    background: #151515;
    border-color: #00ff00;
}

.s23-preset-btn:active, .s23-preset-btn.tuning-active {
    background: #001100;
    border-color: #00ff00;
    box-shadow: 0 1px 0 #003300, inset 0 4px 8px rgba(0, 0, 0, 0.8);
    transform: translateY(3px);
    color: #fff;
    text-shadow: 0 0 8px #00ff00;
}

<!-- SECTION 27: GLOBAL MATRIX VOLUME MONITOR (LIVE TRACK COUNTER)       -->
<!-- =================================================================== -->
<script id="s27-global-matrix-counter">
(() => {
    // 🧠 CONFIGURATION ROSTER: Compile every single database file in the network
    const DATABASE_ROSTER = [
        "load.json",
        "jingles.json",
        "Twilight-zone.json",
        "Suspense.json",
        "Murder_By_Experts.json",
        "Mysterious-Traveler.json",
        "2000-Plus.json",
        "BBC.json",
        "Sci-fi-Radio.json",
        "lord-of-the-rings.json",
        "sherlock.json",
        "Haunted-BBC.json",
        "Alfred-Hitchcock.json",
        "Ray-Bradbury.json"
    ];

    // 🔨 STEP 1: Dynamically mount the tracking HUD overlay element into the DOM
    const counterBadge = document.createElement('div');
    counterBadge.id = 's27-global-hud-counter';
    
    // Strict retro CRT cockpit styling parameters
    const HUD_STYLES = {
        position: 'fixed',
        bottom: '15px',
        right: '15px',
        background: 'rgba(0, 5, 0, 0.9)',
        color: '#00ff00',
        border: '1px solid #005500',
        borderRadius: '4px',
        padding: '6px 10px',
        fontFamily: "'Courier New', monospace",
        fontSize: '11px',
        fontWeight: 'bold',
        textShadow: '0 0 4px rgba(0, 255, 0, 0.6)',
        boxShadow: '0 0 10px rgba(0, 255, 0, 0.15), inset 0 0 4px rgba(0, 255, 0, 0.2)',
        zIndex: '10000',
        pointerEvents: 'none', // Passes clicks straight through so it never blocks elements underneath
        letterSpacing: '1px'
    };
    Object.assign(counterBadge.style, HUD_STYLES);
    counterBadge.innerHTML = `📦 MATRIX VOL: <span style="color:#ffff33;">SCANNING...</span>`;
    document.body.appendChild(counterBadge);

    // 📡 STEP 2: Asynchronous Multi-Channel Summation Engine
    async function calculateGlobalMatrixVolume() {
        console.log("📡 S27 Counter Node: Commencing global network inventory scan...");
        let absoluteTotalTracks = 0;

        // Spin up parallel fetch queries to hit all server endpoints at once
        const scanPromises = DATABASE_ROSTER.map(fileUrl => 
            fetch(fileUrl)
                .then(res => {
                    if (!res.ok) throw new Error(`Node offline: ${fileUrl}`);
                    return res.json();
                })
                .then(data => {
                    let entriesCount = 0;
                    if (data) {
                        if (Array.isArray(data.mp3s)) {
                            entriesCount = data.mp3s.length;
                        } else if (Array.isArray(data)) {
                            entriesCount = data.length;
                        }
                    }
                    console.log(`📊 Node Scan Completed: ${fileUrl} -> ${entriesCount} tracks.`);
                    absoluteTotalTracks += entriesCount;
                })
                .catch(err => {
                    // Silent fail safety: If a specific show JSON isn't deployed yet, skip it gracefully
                    console.warn(`⚠️ S27 Scan Note: Skipping inactive matrix path: ${fileUrl}`);
                })
        );

        // Wait for all network threads to resolve completely
        await Promise.all(scanPromises);

        // 🎛️ STEP 3: Print the compiled tally to the HUD display pane
        // Commas formatting added to make thousands pop cleanly on the screen (e.g., 2,642)
        const formattedTotal = absoluteTotalTracks.toLocaleString();
        counterBadge.innerHTML = `📦 MATRIX VOL: <span style="color:#ffffff; text-shadow: 0 0 6px #00ff00;">${formattedTotal}</span> TOTAL LNKS`;
        console.log(`⚡ S27 Inventory Core Finalized: ${absoluteTotalTracks} total active links verified.`);
    }

    // Trigger the scanner immediately at cold boot sequence
    if (document.readyState === 'complete') {
        calculateGlobalMatrixVolume();
    } else {
        window.addEventListener('load', calculateGlobalMatrixVolume);
    }
})();
</script>
