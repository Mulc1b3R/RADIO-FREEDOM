<script id="s25-radar-finder-node">
(() => {
    const chassis = document.querySelector('.crt-chassis');
    if (!chassis) return;

    // ⚙️ GEOMETRIC ALIGNMENT: Stacked perfectly 55px below your Metadata Button on the right flank
    const RADAR_BUTTON_STYLES = {
        position: 'absolute',
        right: '-145px',
        top: '85px',     // Drops cleanly beneath the metadata node's 30px boundary
        width: '130px',
        height: '48px',
        background: '#111',
        color: '#00ff00',
        border: '2px solid #005500',
        borderRadius: '5px',
        fontFamily: "'Courier New', monospace",
        fontSize: '11px',
        fontWeight: 'bold',
        cursor: 'pointer',
        boxShadow: '0 3px 0 #003300, inset 0 1px 2px rgba(255,255,255,0.1)',
        textShadow: '0 0 4px rgba(0, 255, 0, 0.6)',
        textTransform: 'uppercase',
        zIndex: '9999'
    };

    let radarWindow = null;

    // 🔨 Mount the hardware button faceplate dynamically
    const radarBtn = document.createElement('button');
    radarBtn.id = 's25-radar-find-btn';
    radarBtn.innerHTML = 'LIKE THIS<br><span style="font-size:8px;color:#008800;">RADAR FIND</span>';
    Object.assign(radarBtn.style, RADAR_BUTTON_STYLES);

    // Mechanical animation physics
    radarBtn.addEventListener('mouseenter', () => radarBtn.style.borderColor = '#00ff00');
    radarBtn.addEventListener('mouseleave', () => radarBtn.style.borderColor = '#005500');
    radarBtn.addEventListener('mousedown', () => {
        radarBtn.style.transform = 'translateY(2px)';
        radarBtn.style.boxShadow = '0 1px 0 #003300, inset 0 3px 6px rgba(0,0,0,0.8)';
    });
    radarBtn.addEventListener('mouseup', () => {
        radarBtn.style.transform = 'none';
        radarBtn.style.boxShadow = RADAR_BUTTON_STYLES.boxShadow;
    });

    chassis.appendChild(radarBtn);

    // 🧠 INTELLIGENCE MATRIX: Maps active keywords to related channel search keys
    const RADAR_DICTIONARY = {
        "TWILIGHT": { genre: "SCI-FI ANTHOLOGY", searchKey: "Sci Fi" },
        "SUSPENSE": { genre: "PSYCHOLOGICAL THRILLER", searchKey: "Suspense" },
        "MURDER": { genre: "DETECTIVE NOIR & MYSTERY", searchKey: "Murder" },
        "SCOTLAND": { genre: "BRITISH PROCEDURAL MYSTERY", searchKey: "BBC" },
        "SHERLOCK": { genre: "VICTORIAN DETECTIVE NOIR", searchKey: "Sherlock" },
        "BBC": { genre: "BRITISH HERITAGE DRAMA", searchKey: "BBC" },
        "LOTR": { genre: "EPIC LITERARY FANTASY", searchKey: "lord-of-the-rings" },
        "ALFRED": { genre: "MACABRE MYSTERY AUDIO", searchKey: "Alfred" },
        "RAY": { genre: "SPECULATIVE LITERARY SCI-FI", searchKey: "Ray" }
    };

    function analyzeActiveStream() {
        const player = document.getElementById('audioPlayer');
        if (!player || !player.src || player.src.includes(window.location.hostname)) return null;

        const rawUrl = decodeURIComponent(player.src).toUpperCase();
        let matchedKey = "DEFAULT";
        let genreData = { genre: "GENERIC BROADCAST BLOCK", searchKey: "Suspense" };

        for (let key in RADAR_DICTIONARY) {
            if (rawUrl.includes(key)) {
                matchedKey = key;
                genreData = RADAR_DICTIONARY[key];
                break;
            }
        }

        let extractedTitle = "UNKNOWN SOURCE CARRIER";
        const urlFilename = rawUrl.split('/').pop().replace(/\.[^/.]+$/, "").replace(/[_-]/g, ' ');
        if (urlFilename) extractedTitle = urlFilename;

        return { title: extractedTitle, genre: genreData.genre, searchKey: genreData.searchKey };
    }

    function launchRadarMonitor() {
        const streamAnalysis = analyzeActiveStream();
        if (!streamAnalysis) {
            alert("TACTICAL ERROR: No active stream detected. Link a channel preset first.");
            return;
        }

        const winWidth = 480; const winHeight = 450;
        const leftPos = (window.screen.width / 2) - (winWidth / 2) + 260;
        const topPos = (window.screen.height / 2) - (winHeight / 2) + 80;

        if (radarWindow && !radarWindow.closed) {
            radarWindow.focus();
            renderRadarData(streamAnalysis);
            return;
        }

        radarWindow = window.open('', 'S25_RADAR_FIND_MONITOR', `width=${winWidth},height=${winHeight},top=${topPos},left=${leftPos},resizable=no,scrollbars=no,status=no,location=no,toolbar=no,menubar=no`);
        if (!radarWindow) {
            alert("POP-UP INTERCEPTED: Please white-list this terminal node to deploy the Radar Finder.");
            return;
        }

        const htmlPayload = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>[AUX RADAR] Related Signals</title>
                <style>
                    body { background-color: #000000; color: #33ff33; font-family: 'Courier New', monospace; text-shadow: 0 0 5px #33ff33; padding: 15px; margin: 0; overflow: hidden; border: 2px solid #33ff33; box-sizing: border-box; height: 100vh; }
                    .crt-scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; z-index: 999; }
                    .telemetry-grid { border: 1px solid #005500; background: rgba(0, 10, 0, 0.8); padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-start; gap: 10px; }
                    .header { font-size: 11px; border-bottom: 1px solid #005500; padding-bottom: 4px; color: #fff; text-shadow: 0 0 8px #00ff00; }
                    .meta-block { font-size: 11px; margin-bottom: 5px; line-height: 1.3; }
                    .label { color: #008800; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
                    .vector-list-box { border: 1px solid #003300; background: #000300; flex: 1; overflow-y: auto; border-radius: 3px; }
                    .vector-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; font-size: 11px; border-bottom: 1px solid #002200; cursor: pointer; }
                    .vector-row:hover { background: #001500; color: #fff; }
                    .scan-trigger-btn { background: #000; border: 1px solid #00ff00; color: #00ff00; font-family: monospace; font-size: 9px; font-weight: bold; padding: 3px 6px; cursor: pointer; border-radius: 3px; }
                    .scan-trigger-btn:hover { background: #00ff00; color: #000; }
                </style>
            </head>
            <body>
                <div class="crt-scanlines"></div>
                <div class="telemetry-grid" id="displayBox">
                    <div class="header">🛰️ RADAR POSITION COMPILED</div>
                    <div style="color:#ffff33; padding:10px;">ANALYSING WAVELENGTH...</div>
                </div>
            </body>
            </html>
        `;

        radarWindow.document.write(htmlPayload);
        radarWindow.document.close();
        radarWindow.onload = () => { renderRadarData(streamAnalysis); };
    }

    async function renderRadarData(analysis) {
        const box = radarWindow.document.getElementById('displayBox');
        if (!box) return;

        box.innerHTML = `
            <div class="header">🛰️ SECTION 25 AUXILIARY RADAR CROSS-REFERENCE</div>
            <div class="meta-block">
                <span class="label">PROBED TRACK:</span><br>
                <span style="color:#ffffff; font-size:10px;">${analysis.title.toUpperCase()}</span><br>
                <span class="label">RADAR TARGET MATCH KEY:</span><br>
                <span style="color:#ffff33;">${analysis.searchKey.toUpperCase()} [${analysis.genre}]</span>
            </div>
            <div class="label" style="margin-bottom: -5px;">AUTO-COMPILING CROSS-CHANNEL MATCHES:</div>
            <div class="vector-list-box" id="vectorList">
                <div style="color:#ffaa00; padding:10px;">Crawling repository maps...</div>
            </div>
        `;

        const listContainer = radarWindow.document.getElementById('vectorList');
        let matchedTracks = [];

        try {
            for (let id in window.PRESET_CHANNELS) {
                const ch = window.PRESET_CHANNELS[id];
                const res = await fetch(ch.url);
                if (!res.ok) continue;
                const data = await res.json();
                const tracks = Array.isArray(data) ? data : (data.mp3s || []);
                
                tracks.forEach(t => {
                    if (decodeURIComponent(t).toUpperCase().includes(analysis.searchKey.toUpperCase())) {
                        matchedTracks.push(t);
                    }
                });
            }

            listContainer.innerHTML = '';
            const uniqueTracks = Array.from(new Set(matchedTracks)).slice(0, 15);

            if (uniqueTracks.length === 0) {
                listContainer.innerHTML = `<div style="color:#ff3333; padding:10px;">No exact sister frequencies tracked.</div>`;
                return;
            }

            uniqueTracks.forEach(track => {
                const tName = decodeURIComponent(track).split('/').pop().replace(/\.[^/.]+$/, "").replace(/[_-]/g, ' ');
                const row = radarWindow.document.createElement('div');
                row.className = 'vector-row';
                row.innerHTML = `
                    <span style="max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">⚡ ${tName.toUpperCase()}</span>
                    <button class="scan-trigger-btn">INJECT</button>
                `;

                row.querySelector('.scan-trigger-btn').addEventListener('click', () => {

                            const mainPlayer = window.document.getElementById('audioPlayer');
                const mainInfo = window.document.getElementById('trackInfo');
                
                if (mainPlayer && mainInfo) {
                    mainPlayer.src = track;
                    mainPlayer.play().catch(e => console.warn("Lock active"));
                    mainInfo.innerHTML = `MANUAL OVERRIDE: ${tName.toUpperCase()}<br>[RADAR INTERCEPT ACTIVE]`;
                    row.style.background = '#003300';
                }
            });

            listContainer.appendChild(row);
        });

    } catch (err) {
        listContainer.innerHTML = `<div style="color:#ff3333; padding:10px;">Crawl failed.</div>`;
    }
}

radarBtn.addEventListener('click', launchRadarMonitor);
})();
</script>

<script id="s26-jingle-intercept-core">
(() => {
    // 📡 MASTER AUDIO & TERMINAL HARDWARE ACCESSORS
    const player = document.getElementById('audioPlayer');
    const display = document.getElementById('trackInfo');
    if (!player || !display) {
        console.error("❌ S26 CRITICAL CONFIG: Terminal master audio engine nodes unverified.");
        return;
    }

    // ⏱️ STATE ENGINE VARIABLES
    const TIME_LIMIT_MS = 30 * 60 * 1000;   // Strict 30-minute transitional trigger interval
    let broadcastTimer = null;              // Holds active background interval tracker
    let jingleBreakPending = false;         // Soft-gate boolean latch flag
    let savedShowTrack = null;              // State memory buffer to trap the next scheduled show track

    // 🎲 JINGLE DEPLETION DECK TRACKING CAPACITOR
    let masterJingleLibrary = [];           // Clean raw mirror copy of fetched jingles.json
    let activeJingleDeck = [];              // Shuffled depletion deck loop matrix

    // 🧠 FUNCTION 1: Fetch and Compile the Independent Jingle Manifest Database
    async function initializeJingleSystem() {
        console.log("📡 S26 Matrix Node: Syncing jingles.json broadcast database...");
        try {
            const response = await fetch('jingles.json');
            if (!response.ok) throw new Error(`HTTP Error Status: ${response.status}`);
            const data = await response.json();
            
            if (data && Array.isArray(data.mp3s)) {
                masterJingleLibrary = data.mp3s.slice();
                replenishAndShuffleJingleDeck();
                console.log(`✅ S26 Verification Completed: ${masterJingleLibrary.length} vintage advertising links locked into memory.`);
                
                // Spin up the background countdown clock array immediately
                spinUpBroadcastClock();
            } else {
                console.error("❌ S26 Structure Collision: jingles.json data must format array context inside 'mp3s'.");
            }
        } catch (err) {
            console.warn("⚠️ S26 Initialization Skipped: jingles.json not mapped on host server yet. Standby mode armed.", err);
        }
    }

    // 🎲 FUNCTION 2: Linear Non-Repeating Depletion Shuffle Grid Engine
    function replenishAndShuffleJingleDeck() {
        if (masterJingleLibrary.length === 0) return;
        activeJingleDeck = [...masterJingleLibrary];
        // Mathematical single-pass in-place vector shuffle matrix array rotation
        for (let i = activeJingleDeck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [activeJingleDeck[i], activeJingleDeck[j]] = [activeJingleDeck[j], activeJingleDeck[i]];
        }
        console.log("🎲 S26 Deck Depletion Protection: Jingles array shuffled. Total zero-repetition cycles locked.");
    }

    // ⏱️ FUNCTION 3: Background System Interval Timer (The Soft Gate)
    function spinUpBroadcastClock() {
        if (broadcastTimer) clearInterval(broadcastTimer);
        
        broadcastTimer = setInterval(() => {
            if (!jingleBreakPending) {
                jingleBreakPending = true;
                console.log("🛰️ [SYSTEM CRON STATUS ALERT]: 30-Minute Broadcast Cycle Met. Intercept Latch ARMED for track transition.");
            }
        }, TIME_LIMIT_MS);
        
        console.log("⏱️ S26 Timing Core Active: Automated background commercial scheduler ticking.");
    }

    // 🔀 FUNCTION 4: The Core Event Intercept Hook Override Matrix
    function injectAutomatedJingleBreak(event) {
        // Safe check: If no jingle break is armed or no files exist, skip out and let original scripts play next song
        if (!jingleBreakPending || masterJingleLibrary.length === 0) return;

        // 🛑 STOP PREVENTATIVE FALLTHROUGH: Intercept the native HTML5 player trajectory queue
        event.stopImmediatePropagation();
        console.log("⚡ [TACTICAL INTERCEPT RUNNING]: Overriding native playNextStreamTrack event sequence.");

        // If the main depletion deck has already queued up a song path, trap it in our safety buffer
        if (player.src && !player.src.includes('jingles.json')) {
            // Note: If you want to grab the upcoming track out of activeStreamingDeck instead, do it here
            if (typeof activeStreamingDeck !== 'undefined' && activeStreamingDeck.length > 0) {
                savedShowTrack = activeStreamingDeck[0]; // Peek at upcoming path
            }
        }

        // Pull the top asset cleanly out of the active linear memory depletion grid
        if (activeJingleDeck.length === 0) {
            replenishAndShuffleJingleDeck();
        }
        const targetJingle = activeJingleDeck.shift();

        // Parse a highly descriptive label tracking filename attributes out of the raw link slug
        const filename = decodeURIComponent(targetJingle).split('/').pop().replace(/\.[^/.]+$/, "").replace(/[_-]/g, ' ');

        // 🎛️ INJECT COMPOSITE STATE INTO MAIN TERMINAL
        display.innerHTML = `<span style="color:#ffcc00; animation: blink 1.5s infinite;">📡 [COMMERCIAL INTERCEPT INTERMISSION]</span><br><span style="font-size:11px;color:#888;">MID-CENTURY ADVERTISING ARCHIVE VINTAGE RETROSPECTIVE:</span><br><span style="color:#ffffff;">${filename.toUpperCase()}</span>`;
        
        // Temporarily step down the visualizer buttons or alter tracking indicators if needed
        deactivateTacticalButtons(true);

        // Remove this custom end handler so it doesn't cause loop recursion pile-ups
        player.removeEventListener('ended', handleJinglePlaythroughComplete);
        // Bind the post-ad restitution protocol directly to the audio card node
        player.addEventListener('ended', handleJinglePlaythroughComplete);

        // Slam jingle directly into carrier wave channels and force immediate play sequence
        player.src = targetJingle;
        player.play().catch(e => console.warn("S23 Audio Context buffer lock handled."));

        // Clear the switch so the clock tracking algorithm resets for the next 30-minute block loop
        jingleBreakPending = false;
    }

    // 🔄 FUNCTION 5: Restitution Protocol (Snapping Back to Master Show Timeline)
    function handleJinglePlaythroughComplete() {
        console.log("🔄 S26 Restitution Routine Active: Commercial break completed. Retracting intercept gates.");
        player.removeEventListener('ended', handleJinglePlaythroughComplete);

        // Restore operational state permissions to right-flank hardware selectors
        deactivateTacticalButtons(false);

        // Re-align display terminal text feedback parameters
        display.textContent = "📡 Re-syncing master station transmission node sequence...";

        // If the master player script block functions exist, trigger them natively to restore playlist state
        if (typeof playNextStreamTrack === 'function') {
            console.log("🔌 Re-linking to main depletion deck sequencer...");
            playNextStreamTrack();
        } else {
            // Hard fallback if the standard app thread was broken or lost trace coordinates
            if (savedShowTrack) {
                player.src = savedShowTrack;
                player.play().catch(e => {});
                savedShowTrack = null;
            }
        }
    }

    // 🎚️ AUXILIARY HELPER: Protects Metadata / Like Radar tracking states during commercial slots
    function deactivateTacticalButtons(lockActive) {
        const metaBtn = document.getElementById('s23-meta-probe-btn');
        const radarBtn = document.getElementById('s25-radar-find-btn');
        
        if (lockActive) {
            if (metaBtn) { metaBtn.style.opacity = "0.3"; metaBtn.style.pointerEvents = "none"; }
            if (radarBtn) { radarBtn.style.opacity = "0.3"; radarBtn.style.pointerEvents = "none"; }
        } else {
            if (metaBtn) { metaBtn.style.opacity = "1"; metaBtn.style.pointerEvents = "auto"; }
            if (radarBtn) { radarBtn.style.opacity = "1"; radarBtn.style.pointerEvents = "auto"; }
        }
    }

    // 🔗 DYNAMIC HIGH-PRIORITY TERMINAL INTERCEPT INJECTION POINT
    // We attach this directly onto the player audio end node so it listens BEFORE original loop handlers
    player.addEventListener('ended', injectAutomatedJingleBreak, true);

    // Boot the async database synchronization compiler process
    initializeJingleSystem();
})();
</script>

<!-- SECTION 27: GLOBAL MATRIX VOLUME MONITOR (LIVE TRACK COUNTER)       -->
<!-- =================================================================== -->
<script id="s27-global-matrix-counter">
(() => {
    // 🧠 CONFIGURATION ROSTER: Compile every single database file in the network
    const DATABASE_ROSTER = [
        "load.json",
        "jingles.json",
        "Twilight-zone.json",
        "Suspense.json",
        "Murder_By_Experts.json",
        "Mysterious-Traveler.json",
        "2000-Plus.json",
        "BBC.json",
        "Sci-fi-Radio.json",
        "lord-of-the-rings.json",
        "sherlock.json",
        "Haunted-BBC.json",
        "Alfred-Hitchcock.json",
        "Ray-Bradbury.json"
    ];

    // 🔨 STEP 1: Dynamically mount the tracking HUD overlay element into the DOM
    const counterBadge = document.createElement('div');
    counterBadge.id = 's27-global-hud-counter';
    
    // Strict retro CRT cockpit styling parameters
    const HUD_STYLES = {
        position: 'fixed',
        bottom: '15px',
        right: '15px',
        background: 'rgba(0, 5, 0, 0.9)',
        color: '#00ff00',
        border: '1px solid #005500',
        borderRadius: '4px',
        padding: '6px 10px',
        fontFamily: "'Courier New', monospace",
        fontSize: '11px',
        fontWeight: 'bold',
        textShadow: '0 0 4px rgba(0, 255, 0, 0.6)',
        boxShadow: '0 0 10px rgba(0, 255, 0, 0.15), inset 0 0 4px rgba(0, 255, 0, 0.2)',
        zIndex: '10000',
        pointerEvents: 'none', // Passes clicks straight through so it never blocks elements underneath
        letterSpacing: '1px'
    };
    Object.assign(counterBadge.style, HUD_STYLES);
    counterBadge.innerHTML = `📦 MATRIX VOL: <span style="color:#ffff33;">SCANNING...</span>`;
    document.body.appendChild(counterBadge);

    // 📡 STEP 2: Asynchronous Multi-Channel Summation Engine
    async function calculateGlobalMatrixVolume() {
        console.log("📡 S27 Counter Node: Commencing global network inventory scan...");
        let absoluteTotalTracks = 0;

        // Spin up parallel fetch queries to hit all server endpoints at once
        const scanPromises = DATABASE_ROSTER.map(fileUrl => 
            fetch(fileUrl)
                .then(res => {
                    if (!res.ok) throw new Error(`Node offline: ${fileUrl}`);
                    return res.json();
                })
                .then(data => {
                    let entriesCount = 0;
                    if (data) {
                        if (Array.isArray(data.mp3s)) {
                            entriesCount = data.mp3s.length;
                        } else if (Array.isArray(data)) {
                            entriesCount = data.length;
                        }
                    }
                    console.log(`📊 Node Scan Completed: ${fileUrl} -> ${entriesCount} tracks.`);
                    absoluteTotalTracks += entriesCount;
                })
                .catch(err => {
                    // Silent fail safety: If a specific show JSON isn't deployed yet, skip it gracefully
                    console.warn(`⚠️ S27 Scan Note: Skipping inactive matrix path: ${fileUrl}`);
                })
        );

        // Wait for all network threads to resolve completely
        await Promise.all(scanPromises);

        // 🎛️ STEP 3: Print the compiled tally to the HUD display pane
        // Commas formatting added to make thousands pop cleanly on the screen (e.g., 2,642)
        const formattedTotal = absoluteTotalTracks.toLocaleString();
        counterBadge.innerHTML = `📦 MATRIX VOL: <span style="color:#ffffff; text-shadow: 0 0 6px #00ff00;">${formattedTotal}</span> TOTAL LNKS`;
        console.log(`⚡ S27 Inventory Core Finalized: ${absoluteTotalTracks} total active links verified.`);
    }

    // Trigger the scanner immediately at cold boot sequence
    if (document.readyState === 'complete') {
        calculateGlobalMatrixVolume();
    } else {
        window.addEventListener('load', calculateGlobalMatrixVolume);
    }
})();
</script>
