<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section 23 // Tactical Scope Tester</title>
    <style>
        /* Phosphor Terminal Grid Layout Matrix */
        body {
            background-color: #000000;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #33ff33;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .crt-chassis {
            border: 2px solid #33ff33;
            background: rgba(0, 15, 0, 0.9);
            box-shadow: 0 0 20px #005500, inset 0 0 15px #003300;
            padding: 30px;
            border-radius: 8px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        /* Console Control Deck Button Container */
        .control-deck {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 15px 0;
        }

        /* 1990s Arcade Tactile Push Button Style */
        .power-switch {
            background: #000000;
            border: 2px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #005500;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            flex: 1;
            min-width: 105px;
            text-shadow: none;
        }

        .power-switch:hover {
            background: #33ff33;
            color: #000000;
            box-shadow: 0 0 20px #33ff33;
        }

        /* Responsive Dashboard text readout window */
        #trackInfo {
            font-size: 13px;
            margin: 25px 0;
            height: 60px;
            overflow: hidden;
            border: 1px solid #005500;
            padding: 10px;
            background: #000500;
            border-radius: 4px;
            text-align: left;
            line-height: 1.4;
            word-break: break-all;
        }

        /* HTML5 Native Component Coloring Overrides */
        audio {
            width: 100%;
            margin-top: 15px;
            filter: invert(1) hue-rotate(90deg) saturate(1.5); /* Forces standard players into green camo themes */
        }

        .terminal-specs {
            font-size: 10px;
            color: #008800;
            margin-top: 25px;
            text-shadow: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="crt-chassis">
    <h2>📡 SECTION 23 NODE</h2>
    <p style="font-size: 11px; color: #00aa00;">TACTICAL SONAR/AUDIO INTERCEPT NETWORK</p>
    <br>
    
    <div class="control-deck">
        <button id="playButton" class="power-switch">Connect</button>
        <button id="skipButton" class="power-switch">Skip Track</button>
        <button id="exportLogButton" class="power-switch">Export Log</button>
    </div>

    <!-- 🟢 NEW SCOPE WINDOW: Square Canvas to maintain perfect radar circular dimensions -->
    <canvas id="visualizerGrid" style="width: 100%; height: 260px; border: 1px solid #005500; background: #000500; margin-bottom: 15px; border-radius: 4px;"></canvas>
    
    <div id="trackInfo">Awaiting connection tracking initialization...</div>

    <audio id="audioPlayer" controls></audio>

    <div class="terminal-specs">
        NODE ADDR: 0x63673528404C9B9394d4Ec6FA037ED825c8b0faa<br>
        SYS STATUS: <span id="specsCount">0</span> LINKS HARVESTED // COLD WAR METRICS LIVE<br>
        Copyright © 2026 Psico Communications
    </div>
</div>

<script>
    // --- CORE TRANSMISSION MEDIA & VISUAL SPECTROGRAM MATRIX ---
    const audioPlayer = document.getElementById('audioPlayer');
    const trackInfo = document.getElementById('trackInfo');
    const canvas = document.getElementById('visualizerGrid');
    const ctx = canvas.getContext('2d');
    
    // 🔓 Explicitly bypass browser canvas inspection CORS restrictions
    audioPlayer.crossOrigin = "anonymous";

    let masterLibrary = [];       // Primary backup array storage
    let activeStreamingDeck = [];  // Depletion queue structure loop context
    window.sessionLogRegistry = window.sessionLogRegistry || [];
    
    let audioContext, analyser, sourceNode;
    let radarAngle = 0; // Tracks the rotating sweep hand coordinates

    // Helper method: Cleans raw paths to isolate pure string names
    function getCleanTrackName(srcUrl) {
        if (!srcUrl) return "Unknown Track";
        return decodeURIComponent(srcUrl.substring(srcUrl.lastIndexOf('/') + 1));
    }

    // High-Efficiency Fisher-Yates Randomisation Array Randomiser
    function shuffleBroadcastDeck(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // --- REAL-TIME AUDIO INTERCEPTOR EQUALIZER GRID ENGINE ---
    function initVisualizerEngine() {
        if (audioContext) return; 
        
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 64; // Creates retro tactical blocky layout bands
            
            sourceNode = audioContext.createMediaElementSource(audioPlayer);
            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination); 
            
            drawEqualizerGridLoop();
            console.log("📡 Visualizer Grid Engine online. Audio frequency interceptor locked.");
        } catch (e) {
            console.warn("⚠️ Web Audio initialization blocked. Awaiting secure node manual interaction event.", e);
        }
    }

    // --- SECTION 23 RADAR SPECTROGRAM & PHOSPHOR DECAY ENGINE ---
    function drawEqualizerGridLoop() {
        requestAnimationFrame(drawEqualizerGridLoop);
        
        // Dynamic boundary tracking update
        if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        
        // Check if analyser is running, fallback to dummy array if not yet connected
        const bufferLength = analyser ? analyser.frequencyBinCount : 32;
        const dataArray = new Uint8Array(bufferLength);
        if (analyser) {
            analyser.getByteFrequencyData(dataArray);
        }

        // 🟢 CRT PHOSPHOR TRAIL: Heavy alpha value creates the iconic radar lag effect
        ctx.fillStyle = 'rgba(0, 8, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const maxRadius = Math.min(canvas.width, canvas.height) / 2 * 0.9;

        // --- LAYER 1: THE TACTICAL SCOPE GRID ---
        ctx.shadowBlur = 0; // Remove bloom for fine calibration coordinates
        ctx.strokeStyle = 'rgba(0, 85, 0, 0.4)';
        ctx.lineWidth = 1;

        // Draw concentric range rings
        for (let r = 1; r <= 3; r++) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, maxRadius * (r / 3), 0, 2 * Math.PI);
            ctx.stroke();
        }

        // Horizontal crosshair vector line
        ctx.beginPath();
        ctx.moveTo(centerX - maxRadius, centerY);
        ctx.lineTo(centerX + maxRadius, centerY);
        ctx.stroke();

        // Vertical crosshair vector line
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - maxRadius);
        ctx.lineTo(centerX, centerY + maxRadius);
        ctx.stroke();

        // --- LAYER 2: INTERCEPTED FREQUENCY BANDS ---
        const angleStep = (2 * Math.PI) / bufferLength;
        
        for (let i = 0; i < bufferLength; i++) {
            // Map audio amplitude directly to circular spikes outward
            const amplitude = dataArray[i] / 255;
            const barHeight = amplitude * maxRadius * 0.4;
            
            const currentAngle = i * angleStep;
            
            // Calculate vector coordinates projecting outward from the ring
            const startX = centerX + Math.cos(currentAngle) * (maxRadius * 0.4);
            const startY = centerY + Math.sin(currentAngle) * (maxRadius * 0.4);
            const endX = centerX + Math.cos(currentAngle) * (maxRadius * 0.4 + barHeight);
            const endY = centerY + Math.sin(currentAngle) * (maxRadius * 0.4 + barHeight);
            
            // Render military green sonar pulses
            ctx.strokeStyle = '#33ff33';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#33ff33';
            ctx.shadowBlur = 6; // Heavy neon bloom
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
        }

        // --- LAYER 3: THE SPINNING RADAR SWEEP ---
        radarAngle += 0.02; // Controls rotation velocity index
        if (radarAngle >= 2 * Math.PI) radarAngle = 0;

        const sweepX = centerX + Math.cos(radarAngle) * maxRadius;
        const sweepY = centerY + Math.sin(radarAngle) * maxRadius;

        ctx.strokeStyle = 'rgba(51, 255, 51, 0.3)';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 2;
        
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(sweepX, sweepY);
        ctx.stroke();

                // --- LAYER 4: SHORTWAVE STATIC MATRIX NOISE ---
        ctx.fillStyle = 'rgba(51, 255, 51, 0.04)';
        for (let n = 0; n < 10; n++) {
            const rx = Math.random() * canvas.width;
            const ry = Math.random() * canvas.height;
            ctx.fillRect(rx, ry, 2, 2);
        }
    }

    // --- COMPREHENSIVE STREAM SEQUENCER ---
    async function playNextStreamTrack() {
        initVisualizerEngine();

        if (masterLibrary.length === 0) {
            try {
                trackInfo.textContent = '📡 Syncing master manifest database node...';
                const response = await fetch('load.json');
                const data = await response.json();
                masterLibrary = data.mp3s.slice();
                
                document.getElementById('specsCount').textContent = masterLibrary.length;
                
                activeStreamingDeck = shuffleBroadcastDeck([...masterLibrary]);
                console.log(`📦 Broadcast matrix live: ${masterLibrary.length} tracks committed.`);
            } catch (error) {
                console.error('❌ Error loading transmission node manifest:', error);
                trackInfo.textContent = 'Connection Error: Unable to read load.json data archive.';
                return;
            }
        }

        if (activeStreamingDeck.length === 0) {
            console.log("🔄 Active streaming queue depleted. Reshuffling master matrix...");
            activeStreamingDeck = shuffleBroadcastDeck([...masterLibrary]);
        }

        const targetTrackUrl = activeStreamingDeck.shift();
        const decodedUrl = decodeURIComponent(targetTrackUrl);
        const rawFileName = decodedUrl.substring(decodedUrl.lastIndexOf('/') + 1);

        audioPlayer.src = decodedUrl;
        trackInfo.textContent = `Now playing: ${rawFileName}\n📡 [Queue: ${activeStreamingDeck.length} tracks remaining]`;

        try {
            await audioPlayer.play();
            console.log(`📡 Streaming node locked: ${rawFileName} (${activeStreamingDeck.length} left)`);
        } catch (playError) {
            console.warn('⚠️ Playback blocked by browser policy. Awaiting manual user interaction.', playError);
            trackInfo.textContent = '⚠️ Click "Connect" or hit the play bar below to force the stream.';
        }
    }

    // --- TELEMETRY LOGGER & DYNAMIC WALLPAPER MATRIX ENGINE ---
    audioPlayer.addEventListener('playing', function() {
        const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
        const currentUrl = audioPlayer.src;
        
        let collectionName = "alanwattscollection"; 

        try {
            const parsedUrl = new URL(currentUrl);
            const pathSegments = parsedUrl.pathname.split('/').filter(seg => seg.length > 0);
            
            for(let i = 0; i < pathSegments.length - 1; i++) {
                if(['download', 'details', 'metadata', 'items', 'stream'].includes(pathSegments[i].toLowerCase())) {
                    collectionName = pathSegments[i+1];
                    break;
                }
            }
        } catch(e) {
            console.warn("⚠️ Engine URL Parsing dropped, deploying storage matrix structural bypass.");
        }

        const targetWallpaperUrl = `https://archive.org{collectionName}/__ia_thumb.jpg`;

        document.body.style.backgroundImage = `url('${targetWallpaperUrl}')`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        document.body.style.backgroundRepeat = "no-repeat";

        const logEntry = `[${timestamp}] ✅ PLAYING: ${getCleanTrackName(currentUrl)}\n📍 URL: ${currentUrl}\n🖼️ BG IMAGE: ${targetWallpaperUrl}\n`;
        window.sessionLogRegistry.push(logEntry);
    });

    // --- EXCEPTION INTERCEPT / DEAD LINK SYSTEM AUTO SKIPPER ---
    audioPlayer.addEventListener('error', function() {
        const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
        const failedUrl = audioPlayer.src;
        const errorDetails = audioPlayer.error;
        
        let errorType = "UNKNOWN_ERR";
        if (errorDetails) {
            switch(errorDetails.code) {
                case 1: errorType = "MEDIA_ERR_ABORTED"; break;
                case 2: errorType = "MEDIA_ERR_NETWORK"; break;
                case 3: errorType = "MEDIA_ERR_DECODE"; break;
                case 4: errorType = "MEDIA_ERR_SRC_NOT_SUPPORTED"; break;
            }
        }
        
        const errorLog = `[${timestamp}] ❌ ERROR: ${errorType}\n📍 FAILED URL: ${failedUrl}\n`;
        window.sessionLogRegistry.push(errorLog);
        trackInfo.textContent = `❌ Transmission dropped. Skipping dead node entry...`;
        
        setTimeout(playNextStreamTrack, 1500);
    });

    // --- TELEMETRY EXPORT INTERFACE DOWNLOAD SYSTEM ---
    document.getElementById('exportLogButton').addEventListener('click', function() {
        if(window.sessionLogRegistry.length === 0) {
            alert("No data recorded in telemetry logs yet.");
            return;
        }
        const logBlob = new Blob([window.sessionLogRegistry.join("\n")], { type: 'text/plain' });
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = URL.createObjectURL(logBlob);
        downloadAnchor.download = `section23_node_telemetry.txt`;
        downloadAnchor.click();
    });

    // Master Event Hooks Assignment Layout Grid
    document.getElementById('playButton').addEventListener('click', playNextStreamTrack);
    document.getElementById('skipButton').addEventListener('click', playNextStreamTrack); 
    audioPlayer.addEventListener('ended', playNextStreamTrack);

    // Initial dummy screen draw loop boot to showcase radar animation immediately on load
    drawEqualizerGridLoop();
</script>

</body>
</html>
