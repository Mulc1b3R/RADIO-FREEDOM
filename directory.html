<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta charset="UTF-8">
    <title>RADIO-FREEDOM // STATIC MASTER DIRECTORY</title>
    <style>
        body {
            background: #000500;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        h3 {
            border-bottom: 1px solid #005500;
            padding-bottom: 8px;
            letter-spacing: 2px;
            font-size: 14px;
            text-align: center;
            margin-top: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .channel-row {
            background: #000c00;
            border: 1px solid #004400;
            padding: 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .channel-row:hover {
            background: #002200;
            border-color: #33ff33;
            box-shadow: 0 0 8px #003300;
        }
        .status-terminal {
            font-size: 11px;
            color: #008800;
            margin-top: 15px;
            text-align: center;
            border-top: 1px dashed #003300;
            padding-top: 10px;
            line-height: 1.5;
        }
        .tag-preset { color: #33ff33; font-weight: bold; }
        .tag-extra { color: #ffcc00; font-weight: bold; }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h3>📡 STATION MASTER REGISTRY DIRECTORY</h3>
    <div id="directoryGrid" class="grid-container">📥 Initialising data pipeline...</div>
    <div class="status-terminal" id="terminalStatus">OFFLINE STATIC MATRIX MODE // STABLE</div>

    <script>
// Inside directory.html (right under your masterPlaylistFiles array declaration)
if (window.opener && !window.opener.closed) {
    // Expose the popup's files globally to the main console cockpit
    window.opener.window.extendedVaultRegistry = masterPlaylistFiles;
    console.log(`📡 Vault matrix registered to main cockpit: ${masterPlaylistFiles.length} files shared.`);
}
    </script>
    
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const grid = document.getElementById("directoryGrid");
        const statusText = document.getElementById("terminalStatus");
        const mainWin = window.opener;
        
        if (!mainWin) {
            grid.innerHTML = "<p style='color:red;'>❌ ERROR: Main transmission cockpit link offline.</p>";
            return;
        }

        // 🗄️ LIVE REPOSITORY SNAPSHOT MATRIX MAP (73,000 File Fleet)
        const masterPlaylistFiles = [
            "2000-Plus.json", 
            "Alfred-Hitchcock.json", 
            "BBC.json", 
            "Drone-Zone.json",
            "Exploring-Tomororw.json", 
            "otrb.json", 
            "Haunted-BBC.json",
            "Murder_By_Experts.json", 
            "Mysterious-Traveler.json", 
            "Ray-Bradbury.json",
            "Sci-fi-Radio.json", 
            "Suspense.json", 
            "The-Shadow.json", 
            "Twilight-zone.json",
            "X-Minus-One.json", 
            "bbc comedy.json", 
            "beyond-tomorrow.json", 
            "infected.json", 
            "test.json", 
            "wise-crack-dictionary.json",
            "psychedelia.json",
            "politicsandprose.json",
            "the-history-of-rome.json",
            "bbc_world_service.json",
            "somafmlive.json",
            "living-the-blues-louisiana-blues-classics.json",
            "250-years-of-great-music.json",
            "fm-radio-archive-music-broadcast-collection.json",
            "bach-the-masterpiece-collection.json",
            "your-hit-parade-50s-instrumentals.json",
            "living-the-blues-the-70s-blues-classics.json",
            "ivoox.com.json",
            "boxcars711.json",
            "old-time-radio-christmas-shows.json",
            "Mystery-Shows.json",
            "choice-classic-radio.json",
            "acast-com.json",
            "Murder_By_Experts.json",
            "78rpm_shira-berk.json",
            "archive.json",
            "pirateradioairchecks.json",
            "Pearl_Jam_Bootleg.json",
            "GusArnheimCollection.json",
            "sonic-youth-1986.json",
            "communistmanifesto.json",
            "ssf088_2210.json",
            "gunsmoke_radio_show.json",
            "abbottandcostello.json",
            "Lum-and-Abner-OTR.json",
            "Sam_Spade_Singles.json",
            "lord-of-the-rings.json",
            "OrsonWelles-MercuryTheater.json",
            "Tarzan_Singles.json",
            "Manly_P.Hall.json"
            


             ];
       
        const presetFiles = [];
        if (mainWin.PRESET_CHANNELS) {
            Object.values(mainWin.PRESET_CHANNELS).forEach(ch => {
                if (ch && ch.url) presetFiles.push(ch.url);
            });
        }

        statusText.innerText = `TOTAL MANIFESTS LOADED: ${masterPlaylistFiles.length} ACTIVE PIPES`;
        grid.innerHTML = ""; 

        masterPlaylistFiles.forEach(fileName => {
            const isPreset = presetFiles.includes(fileName);
            const cleanName = fileName.replace(".json", "").replace(/[-_]/g, " ").toUpperCase();
            
            const row = document.createElement("div");
            row.className = "channel-row";
            
            if (isPreset) {
                row.innerHTML = `<span>[⚙️ PRESET] ${cleanName}</span> <span class="tag-preset">${fileName}</span>`;
            } else {
                row.innerHTML = `<span>[📂 EXTRA] ${cleanName}</span> <span class="tag-extra">${fileName}</span>`;
            }
            
            // 🚀 INTERCEPT PLAYER CARRIER OVERRIDE LOOP
            row.addEventListener("click", async () => {
                row.style.borderColor = "#ffcc00";
                
                try {
                    // Direct fetch pass to match your raw repository string layouts natively
                    const fileResponse = await fetch(fileName);
                    
                    if (!fileResponse.ok) {
                        throw new Error(`HTTP network fault code: ${fileResponse.status}`);
                    }
                    
                    const data = await fileResponse.json();
                    
                    if (data && Array.isArray(data.mp3s) && data.mp3s.length > 0) {
                        // 🔒 1. LOCK PARENT ENGINE VARIABLES
                        mainWin.masterLibrary = data.mp3s.slice();
                        mainWin.searchMasterMatrix = data.mp3s.slice();
                        
                        if (typeof mainWin.shuffleBroadcastDeck === "function") {
                            mainWin.window.activeStreamingDeck = mainWin.shuffleBroadcastDeck([...mainWin.masterLibrary]);
                        } else {
                            mainWin.window.activeStreamingDeck = data.mp3s.slice();
                        }
                        
                        // Update links harvested spec counter layout widget
                        const specsCounter = mainWin.document.getElementById('specsCount');
                        if (specsCounter) specsCounter.textContent = mainWin.masterLibrary.length;
                        
                        // 🧼 2. AUTOMATED SEARCH SCRUBBER RESET
                        const searchInput = mainWin.document.getElementById('trackSearchInput');
                        const searchDisplay = mainWin.document.getElementById('searchResultsDisplay');
                        if (searchInput) searchInput.value = "";
                        if (searchDisplay) { 
                            searchDisplay.innerHTML = ""; 
                            searchDisplay.style.display = "none"; 
                        }

                        // 🚀 3. THE ABSOLUTE OVERRIDE SECURITY FORCE
                        // Hard-assigns the tracking fields to protect them from background thread resets
                        mainWin.window.activeTargetFileTrackSignature = fileName;
                        mainWin.window.currentCollection = fileName;
                        mainWin.window.currentChannelIndex = "99"; 

                        // Pull the first track from our new queue right now inside the popup thread
                        const nextTrackUrl = mainWin.window.activeStreamingDeck.shift();
                        if (nextTrackUrl) {
                            const pDom = mainWin.document;
                            const player = pDom.getElementById('audioPlayer');
                            const txtPanel = pDom.getElementById('trackInfo');
                            
                            if (player) {
                                // Stop any active player thread audio immediately
                                player.pause();
                                
                                // Directly set the player source bypass, bypassing main.js auto-load constraints
                                player.src = decodeURIComponent(nextTrackUrl);
                                
                                // Clean up the display track panel text manually
                                const trackTitle = player.src.substring(player.src.lastIndexOf('/') + 1);
                                if (txtPanel) {
                                    txtPanel.textContent = `Now playing: ${trackTitle}\n📡 [Queue: ${mainWin.window.activeStreamingDeck.length} tracks remaining]`;
                                }
                                
                                // Log the action into your master Session Telemetry Register
                                if (mainWin.window.sessionLogRegistry) {
                                    const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
                                    mainWin.window.sessionLogRegistry.push(`[${timestamp}] POPUP OVERRIDE LOCKED: ${trackTitle}`);
                                }

                                // Force the hardware audio engine to play immediately
                                player.play().catch(e => console.warn("Context hold handled safely."));
                            }
                        }
                        
                        // Green light verification confirmation clear
                        row.style.borderColor = "#33ff33";

                        // ⚠️ 4. FORCE OPERATOR OVERRIDE WARNING SCREEN INJECTION
                        statusText.innerHTML = `
                            <span style="color:#ffcc00; font-weight:bold; animation: blink 1.5s infinite;">
                                ⚠️ [OVERRIDE ACTIVE ON COCKPIT]
                            </span><br>
                            <span style="font-size:10px; color:#888;">
                                TO RESTORE BASELINE TUNER STACK: REFRESH PLAYER (F5)
                            </span>
                        `;
                    } else {
                        throw new Error("Target file container data structure corrupted or empty.");
                    }
                } catch (err) {
                    console.error("❌ Override Execution Fault:", err);
                    row.style.borderColor = "red";

                     }
            });
            
            grid.appendChild(row);
        });
    });
</script>
    <script>
(function initCustomWallpaperEngine() {
    // 1. Core wallpaper lookup matrix function
    window.updateTerminalWallpaper = async function(trackUrl) {
        if (!trackUrl) return;
        
        const bodyElement = document.body;
        const cleanUrl = trackUrl.trim();

        // If it's a standard Archive.org link, abort execution and let the native engine handle it on line 217
        if (cleanUrl.startsWith("https://archive.org") || cleanUrl.startsWith("http://archive.org")) {
            console.log("Archive.org asset detected. Passing tracking to native engine.");
            return; 
        }

        // Extract streaming filename out of the active path
        // e.g., "https://somafm.com" -> "lush-128-mp3"
        const streamFileName = cleanUrl.split('/').pop();

        try {
            const response = await fetch('wallpaper-registry.json');
            if (!response.ok) throw new Error("Registry file missing or inaccessible");
            
            const registry = await response.json();
            const matchedWallpaperUrl = registry[streamFileName];

            if (matchedWallpaperUrl) {
                bodyElement.style.backgroundImage = `url('${matchedWallpaperUrl}')`;
                bodyElement.style.backgroundSize = "cover";
                bodyElement.style.backgroundPosition = "center";
                bodyElement.style.backgroundAttachment = "fixed";
                console.log(`Wallpaper Interceptor: Injected ${streamFileName}`);
            } else {
                console.warn(`Wallpaper Interceptor: No matching key found for ${streamFileName}`);
            }
        } catch (error) {
            console.error("Wallpaper Interceptor Failure:", error);
        }
    };

    // 2. Automated Event Interceptor: Binds cleanly to your main.js player variable
    // This runs completely independently from inside index.html without modifying main.js
    const targetPlayer = document.getElementById('audioPlayer');
    if (targetPlayer) {
        targetPlayer.addEventListener('loadstart', () => {
            if (window.updateTerminalWallpaper) {
                window.updateTerminalWallpaper(targetPlayer.src);
            }
        });
        console.log("📡 Background interceptor actively tracking 'audioPlayer' pipeline.");
    } else {
        console.error("❌ Critical: Could not lock onto 'audioPlayer' node. Check element loading order.");
    }
})();
</script>
