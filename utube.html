<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Section 23 // YouTube Terminal</title>
    <style>
        /* Phosphor Terminal Grid Layout Matrix - Identical Twin Profile */
        body {
            background-color: #000000;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #33ff33;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .crt-chassis {
            border: 2px solid #33ff33;
            background: rgba(0, 15, 0, 0.9);
            box-shadow: 0 0 20px #005500, inset 0 0 15px #003300;
            padding: 30px;
            border-radius: 8px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        /* Viewport Frame for YouTube Object Mapping */
        .cockpit-screen {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid #005500;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Enforce exact dimensional fitting for your custom iframe snippet */
        #ytVideoFrame {
            width: 100%;
            height: 100%;
        }

        /* Console Control Deck Button Container */
        .control-deck {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* 1990s Arcade Tactile Push Button Style */
        .power-switch {
            background: #000000;
            border: 2px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 12px 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #005500;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            flex: 1;
            text-shadow: none;
        }

        .power-switch:hover {
            background: #33ff33;
            color: #000000;
            box-shadow: 0 0 20px #33ff33;
        }

        /* Tactical Command Input Box */
        .matrix-input {
            width: 100%;
            background: #000500;
            border: 1px solid #005500;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            padding: 10px;
            box-sizing: border-box;
            font-size: 12px;
            border-radius: 4px;
            outline: none;
            text-shadow: 0 0 3px #33ff33;
        }
        .matrix-input:focus {
            border-color: #33ff33;
            box-shadow: 0 0 8px #005500;
        }

        /* Responsive Dashboard text readout window */
        #trackInfo {
            font-size: 12px;
            margin: 25px 0;
            height: 65px;
            overflow: hidden;
            border: 1px solid #005500;
            padding: 10px;
            background: #000500;
            border-radius: 4px;
            text-align: left;
            line-height: 1.4;
            word-break: break-all;
        }

        /* Terminal Logging Box Readout Window */
        #generatedUrlLog {
            font-size: 11px; 
            color: #00aa00; 
            margin: 15px 0; 
            padding: 8px; 
            background: #000a00; 
            border: 1px dashed #004400; 
            border-radius: 4px; 
            text-align: left; 
            word-break: break-all; 
            font-family: monospace;
        }

        .terminal-specs {
            font-size: 11px;
            color: #008800;
            margin-top: 12px;
            line-height: 1.6 !important;
            padding-bottom: 5px;
        }

        /* Core Return Link Anchor Style */
        .return-link {
            display: inline-block;
            margin-top: 15px;
            color: #008800;
            text-decoration: none;
            font-size: 11px;
        }
        .return-link:hover {
            color: #33ff33;
        }
    </style>
</head>
<body>

    <div class="crt-chassis">
        <!-- COCKPIT VIEWPORT SCREEN -->
        <div class="cockpit-screen">
            <!-- ⚡ MOUNTED: Your exact required embed code layout template -->
            <iframe id="ytVideoFrame" width="560" height="315" src="about:blank" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <!-- OVERRIDE CONTROLS -->
        <input type="text" id="targetUrlInput" class="matrix-input" placeholder="PASTE 11-CHAR VIDEO ID ONLY..." autocomplete="off">

        <div class="control-deck">
            <div class="button-row">
                <button class="power-switch" id="loadPayloadBtn">LOAD IN-FRAME</button>
                <button class="power-switch" id="launchExternalBtn">LAUNCH TAB</button>
            </div>
            <button class="power-switch" id="killFeedBtn" style="width: 100%;">KILL FEED SIGNAL</button>
        </div>

        <!-- READOUT PANEL -->
        <div id="trackInfo">TERMINAL READY // INPUT EXCLUSIVELY ACCEPTS RAW 11-CHARACTER CODES...</div>

        <!-- REAL-TIME GENERATED LINK SPEC READOUT -->
        <div id="generatedUrlLog">GENERATED URL: (EMPTY SIGNAL)</div>

        <!-- HARDWARE FLEET SPECS METRICS -->
        <div class="terminal-specs">
            SYS: YT-FAILSAFE EMBED v1.5<br>
            SIGNAL: STRICT DEPLOYMENT EMULATION<br>
            STATUS: PIPELINE SECURED
        </div>

        <a href="index.html" class="return-link">&lt; RETURN TO MAIN PIRATE CHASSIS</a>
    </div>

    <script>
        // Hardware Execution Loop
        document.getElementById('loadPayloadBtn').addEventListener('click', () => {
            // Read input code directly without risky array-splitting functions
            const targetCode = document.getElementById('targetUrlInput').value.trim();

            if (!targetCode || targetCode.length !== 11) {
                document.getElementById('trackInfo').innerText = "❌ ERROR: SOURCE STRING DEVIATES FROM 11-CHAR LIMIT.\nEXAMPLE ENTRY format: p9_LFdp0XLg";
                document.getElementById('generatedUrlLog').innerText = "GENERATED URL: (ABORTED)";
                return;
            }

            // ⚡ BUILD URL USING ACCURATE TEMPLATE LITERAL SYNTAX
            const targetUrl = `https://www.youtube.com/watch?v=${targetCode}`;
            
            // Push link to iframe src attribute
            document.getElementById('ytVideoFrame').src = targetUrl;
            
            // 📡 OUTPUT TO LIVE DIAGNOSTIC LINK LOG PANEL
            document.getElementById('generatedUrlLog').innerHTML = `GENERATED URL: <a href="${targetUrl}" target="_blank" style="color: #33ff33; text-decoration: underline;">${targetUrl}</a>`;
            
            // Update UI dashboard readouts
            document.getElementById('targetUrlInput').value = ''; 
            document.getElementById('trackInfo').innerText = `BROADCAST CONFIRMED: YT-${targetCode}\n📡 SIGNAL CARRIER ENFORCED. CLICK PLAY ON VIDEO CONTAINER SCREEN.`;
        });

        // External Window Deployment Circuit
        document.getElementById('launchExternalBtn').addEventListener('click', () => {
            const targetCode = document.getElementById('targetUrlInput').value.trim();
            if (!targetCode || targetCode.length !== 11) return;

            const externalUrl = `https://www.youtube.com/watch?v=${targetCode}`;
            
            document.getElementById('generatedUrlLog').innerHTML = `GENERATED URL (TAB): <a href="${externalUrl}" target="_blank" style="color: #33ff33; text-decoration: underline;">${externalUrl}</a>`;
            window.open(externalUrl, '_blank');
            document.getElementById('trackInfo').innerText = `TACTICAL OVERRIDE: SEPARATE WINDOW ASSIGNED.\nMARKER: YT-${targetCode}`;
        });

        // Listen for Enter key shortcut commands inside entry box
        document.getElementById('targetUrlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loadPayloadBtn').click();
            }
        });

        // Emergency Clear Command Button
        document.getElementById('killFeedBtn').addEventListener('click', () => {
            document.getElementById('ytVideoFrame').src = 'about:blank';
            document.getElementById('trackInfo').innerText = "FEED ABSOLUTELY TERMINATED // CARRIER SIGNAL EMPTY.";
            document.getElementById('generatedUrlLog').innerText = "GENERATED URL: (EMPTY SIGNAL)";
        });
    </script>
</body>
</html>
