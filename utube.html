<!DOCTYPE html>
<html lang="en">
<head>

    <title>Section 23 // YouTube Dynamic Injection Terminal</title>
    <style>
        /* Phosphor Terminal Grid Layout Matrix - Identical Twin Profile */
        body {
            background-color: #000000;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #33ff33;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .crt-chassis {
            border: 2px solid #33ff33;
            background: rgba(0, 15, 0, 0.9);
            box-shadow: 0 0 20px #005500, inset 0 0 15px #003300;
            padding: 30px;
            border-radius: 8px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        /* Viewport Frame Container for Dynamic Injection */
        .cockpit-screen {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid #005500;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Enforce absolute 100% fitting for the dynamically injected snippet */
        .cockpit-screen iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }

        /* Console Control Deck Button Container */
        .control-deck {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* 1990s Arcade Tactile Push Button Style */
        .power-switch {
            background: #000000;
            border: 2px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 12px 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #005500;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            flex: 1;
            text-shadow: none;
        }

        .power-switch:hover {
            background: #33ff33;
            color: #000000;
            box-shadow: 0 0 20px #33ff33;
        }

        /* Tactical Command Input Box */
        .matrix-input {
            width: 100%;
            background: #000500;
            border: 1px solid #005500;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            padding: 10px;
            box-sizing: border-box;
            font-size: 12px;
            border-radius: 4px;
            outline: none;
            text-shadow: 0 0 3px #33ff33;
        }
        .matrix-input:focus {
            border-color: #33ff33;
            box-shadow: 0 0 8px #005500;
        }

        /* Responsive Dashboard text readout window */
        #trackInfo {
            font-size: 12px;
            margin: 25px 0;
            height: 65px;
            overflow: hidden;
            border: 1px solid #005500;
            padding: 10px;
            background: #000500;
            border-radius: 4px;
            text-align: left;
            line-height: 1.4;
            word-break: break-all;
        }

        /* Terminal Logging Box Readout Window */
        #generatedUrlLog {
            font-size: 11px; 
            color: #00aa00; 
            margin: 15px 0; 
            padding: 8px; 
            background: #000a00; 
            border: 1px dashed #004400; 
            border-radius: 4px; 
            text-align: left; 
            word-break: break-all; 
            font-family: monospace;
        }

        .terminal-specs {
            font-size: 11px;
            color: #008800;
            margin-top: 12px;
            line-height: 1.6 !important;
            padding-bottom: 5px;
        }

        /* Core Return Link Anchor Style */
        .return-link {
            display: inline-block;
            margin-top: 15px;
            color: #008800;
            text-decoration: none;
            font-size: 11px;
        }
        .return-link:hover {
            color: #33ff33;
        }
    </style>
</head>
<body>

    <!-- 🔒 FIXED: Return link extracted and pinned directly to the bottom left edge of the screen viewport -->
    <a href="index.html" class="return-link" style="position: fixed; bottom: 20px; left: 20px; color: #008800; text-decoration: none; font-size: 11px; z-index: 99999; font-family: 'Courier New', monospace; text-shadow: 0 0 5px #33ff33;" onmouseover="this.style.color='#33ff33'" onmouseout="this.style.color='#008800'">&lt; RETURN TO MAIN PIRATE CHASSIS</a>

    <div class="crt-chassis">
        <!-- COCKPIT VIEWPORT SCREEN (Target for hard HTML text injection) -->
        <div class="cockpit-screen" id="viewportScreen">
            <div style="color: #004400; padding: 20px; font-size: 11px;">MONITOR VIEWPORT POWERED DOWN // CARRIER EMPTY</div>
        </div>

        <!-- OVERRIDE CONTROLS -->
        <input type="text" id="targetUrlInput" class="matrix-input" placeholder="PASTE 11-CHAR ID (e.g. p9_LFdp0XLg)" autocomplete="off">

        <div class="control-deck">
            <div class="button-row">
                <button class="power-switch" id="loadPayloadBtn">DYNAMIC INJECT</button>
                <button class="power-switch" id="launchExternalBtn">LAUNCH TAB</button>
            </div>
            <button class="power-switch" id="killFeedBtn" style="width: 100%;">PURGE MATRIX NODE</button>
        </div>

        <!-- READOUT PANEL -->
        <div id="trackInfo">DYNAMIC ENGINE READY // BYPASSING DYNAMIC IFRAME INTERFACES...</div>

        <!-- REAL-TIME GENERATED LINK SPEC READOUT -->
        <div id="generatedUrlLog">GENERATED IFRAME STR: (EMPTY SIGNAL)</div>

        <!-- HARDWARE FLEET SPECS METRICS -->
        <div class="terminal-specs">
            SYS: YT-DYNAMIC DOM GENERATOR v1.6<br>
            SIGNAL: HARD REWRITE ROUTE PROTOCOL<br>
            STATUS: SECURITY BYPASS RUNNING
        </div>
    </div>

    <script>
        // 📡 TIER 2 LOCAL RECORD ENGINES DATABASE MATRIX
        // Maps words or titles to raw 11-character system slugs safely
        const localVideoDatabase = [
            { id: "p9_LFdp0XLg", title: "Infected - 1984 Dark Genesis EP", keywords: ["infected", "1984", "dark genesis", "genesis"] },
            { id: "b08_M4L1B08", title: "Shortwave Static Numbers Station Loop", keywords: ["shortwave", "static", "numbers", "loop", "background"] }
        ];

        // Extraction block that isolates clean 11-character video tokens safely
        function cleanVideoCoordinates(input) {
            const trimmed = input.trim();
            if (!trimmed) return null;

            if (trimmed.includes('v=')) {
                return trimmed.split('v=')[1].split('&')[0];
            }
            if (trimmed.includes('youtu.be/')) {
                return trimmed.split('youtu.be/')[1].split('?')[0];
            }
            if (trimmed.includes('embed/')) {
                return trimmed.split('embed/')[1].split('?')[0];
            }
            return trimmed;
        }

        // Action A: Dynamic Dom HTML String Overwrite Loop with Integrated Keyword Engine
        document.getElementById('loadPayloadBtn').addEventListener('click', () => {
            const rawInput = document.getElementById('targetUrlInput').value;
            if (!rawInput) return;

            // --- STEP 1: TEST TIER 1 INPUT (DIRECT ID OR URL) ---
            let targetCode = cleanVideoCoordinates(rawInput);
            let detectionSource = "DIRECT ID LINK CORRELATION";

            // If it is not a direct 11-char sequence, initiate search scanning protocols
            if (!targetCode || targetCode.length !== 11) {
                
                // --- STEP 2: TEST TIER 2 INPUT (LOCAL DATABASE SCANNING) ---
                const searchPhrase = rawInput.trim().toLowerCase();
                const localMatch = localVideoDatabase.find(track => 
                    track.title.toLowerCase().includes(searchPhrase) || 
                    track.keywords.some(keyword => searchPhrase.includes(keyword))
                );

                if (localMatch) {
                    targetCode = localMatch.id;
                    detectionSource = `LOCAL MATRIX MATCH: "${localMatch.title}"`;
                } else {
                    // --- STEP 3: FALLBACK TO TIER 3 (GLOBAL YOUTUBE SEARCH EXTRACTION) ---
                    const encodedSearchQuery = encodeURIComponent(rawInput.trim());
                    const globalSearchUrl = `https://youtube.com{encodedSearchQuery}`;
                    
                    document.getElementById('generatedUrlLog').innerHTML = `GLOBAL SEARCH LINK: <a href="https://www.youtube.com/results?${globalSearchUrl}" target="_blank" style="color: #33ff33; text-decoration: underline;">${globalSearchUrl}</a>`;
                    window.open(globalSearchUrl, '_blank');
                    
                    document.getElementById('trackInfo').innerText = `❌ NO LOCAL MATCH // DEPLOYING GLOBAL SEARCH ROUTE.\nQUERY: "${rawInput}" OPENED IN NEW TAB.`;
                    document.getElementById('targetUrlInput').value = '';
                    return; // Halt layout injection since user is redirected
                }
            }

            // 🛠️ THE STRATEGY: Build your exact required native embed iframe code snippet as a raw text layout string
            const dynamicIframeHtml = `<iframe width="560" height="315" src="https://youtube.com/embed/${targetCode}?si=rvPpTUoC7V4JefXB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
            
            // Wipe the cockpit area completely clean and smash the brand-new element directly into the DOM
            document.getElementById('viewportScreen').innerHTML = dynamicIframeHtml;
            
            // 📡 Log the exact raw code being generated for your debugging terminal specs panel
            document.getElementById('generatedUrlLog').innerText = `INJECTED IFRAME: ${dynamicIframeHtml}`;
            
            // Clean up text input space and update dashboard metrics
            document.getElementById('targetUrlInput').value = ''; 
            document.getElementById('trackInfo').innerText = `BROADCAST CONFIRMED: YT-${targetCode} [${detectionSource}]\n⚡ HARD DOM REWRITE STABILIZED. CLICK PLAY DIRECTLY INSIDE VIEWPORT screen.`;
        });

        // Action B: External Tab Deployment Bypass with multi-tier route optimization
        document.getElementById('launchExternalBtn').addEventListener('click', () => {
            const rawInput = document.getElementById('targetUrlInput').value;
            if (!rawInput) return;

            let targetCode = cleanVideoCoordinates(rawInput);

            // Run database lookup fallback check if raw input isn't a direct address link
            if (!targetCode || targetCode.length !== 11) {
                const searchPhrase = rawInput.trim().toLowerCase();
                const localMatch = localVideoDatabase.find(track => 
                    track.title.toLowerCase().includes(searchPhrase) || 
                    track.keywords.some(keyword => searchPhrase.includes(keyword))
                );
                if (localMatch) {
                    targetCode = localMatch.id;
                }
            }

            // If it is still missing or unverified, launch standard global search loop parameters instead
            if (!targetCode || targetCode.length !== 11) {
                const encodedSearchQuery = encodeURIComponent(rawInput.trim());
                const globalSearchUrl = `https://youtube.com{encodedSearchQuery}`;
                document.getElementById('generatedUrlLog').innerHTML = `GLOBAL SEARCH LINK: <a href="${globalSearchUrl}" target="_blank" style="color: #33ff33; text-decoration: underline;">${globalSearchUrl}</a>`;
                window.open(globalSearchUrl, '_blank');
                document.getElementById('trackInfo').innerText = `TACTICAL SEARCH DEPLOYED: MATCH MISSING. GLOBAL TAB OVERRIDE ENGAGED.`;
                document.getElementById('targetUrlInput').value = '';
                return;
            }

            const externalUrl = `https://youtube.com/{targetCode}`;
            window.open(externalUrl, '_blank');
            document.getElementById('trackInfo').innerText = `TACTICAL OVERRIDE: SEPARATE WINDOW ASSIGNED.\nMARKER: YT-${targetCode}`;
        });

        // Execute loading loop automatically when user punches Enter inside entry field
        document.getElementById('targetUrlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loadPayloadBtn').click();
            }
        });

        // Clear display path completely
        document.getElementById('killFeedBtn').addEventListener('click', () => {
            document.getElementById('viewportScreen').innerHTML = '<div style="color: #004400; padding: 20px; font-size: 11px;">MONITOR VIEWPORT POWERED DOWN // CARRIER EMPTY</div>';
            document.getElementById('trackInfo').innerText = "FEED ABSOLUTELY TERMINATED // CARRIER SIGNAL EMPTY.";
            document.getElementById('generatedUrlLog').innerText = "GENERATED IFRAME STR: (EMPTY SIGNAL)";
        });

    </script>
</body>
